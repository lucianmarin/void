server {
    listen 443 ssl http2;
    server_name void.lucianmarin.com;
    access_log /home/lucian/logs/void.log.gz combined gzip;
    ssl_certificate /etc/letsencrypt/live/void.lucianmarin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/void.lucianmarin.com/privkey.pem;
    location /assets {
        root /home/lucian/void/dist;
        expires 365d;
        autoindex off;
    }
    location /textures {
        root /home/lucian/void/dist;
        expires 365d;
        autoindex off;
    }
    location /.well-known/acme-challenge {
        root /home/lucian;
    }
    location / {
        root /home/lucian/void/dist;
        index index.html;
    }
}

server {
    listen 80;
    server_name void.lucianmarin.com;
    return 301 https://void.lucianmarin.com$request_uri;
}

